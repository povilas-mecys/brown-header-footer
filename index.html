<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brown University</title>

    <style>
      /* ==================================================================
         1. Design tokens
         ================================================================== */

      :root {
        /* Colour */
        --brown: #4e3629; /* Header + footer background, skip-link text */
        --shade: #432d22; /* Copyright bar background */
        --red: #d71a20; /* Top accent bar (gradient start) */
        --yellow: #ffc72c; /* Footer links, link underline, skip link, focus ring */
        --white: #fff; /* Header + footer text */
        --sand: #b7b09c; /* "Brown University" label in footer */
        --rule: #634e40; /* Dividers: header logo/unit name, above footer nav */

        /* Typography */
        --font: Arial, Helvetica, sans-serif;
        --text-sm: 12px;
        --text-base: 14px;
        --text-lg: 16px;

        /* Spacing */
        --space: 16px;
        --space-lg: 40px;

        /* Layout */
        --max: 1370px;
        --gutter: 24px;
        --inset: max(var(--gutter), calc((100% - var(--max)) / 2 + var(--gutter)));
      }

      /* ==================================================================
         2. Reset & base
         ================================================================== */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: var(--font);

        & main {
          flex: 1;
        }

        & main:focus {
          outline: none;
        }
      }

      /* ==================================================================
         3. Skip link & focus
         ================================================================== */

      .skip-link {
        position: absolute;
        top: 0;
        left: 50%;
        z-index: 1;
        padding: var(--space) calc(var(--space) * 1.5);
        background: var(--yellow);
        color: var(--brown);
        text-decoration: none;
        translate: -50% -100%;
      }

      .skip-link:focus {
        translate: -50%;
      }

      .skip-link:focus-visible,
      body > :is(header, footer) a:focus-visible {
        outline: 1px solid var(--yellow);
        outline-offset: 2px;
      }

      /* ==================================================================
         4. Shared header & footer
         ================================================================== */

      body > :is(header, footer) {
        border-top: 4px solid var(--red);
        border-image: linear-gradient(to right, var(--red), var(--brown)) 1;
        background: var(--brown);
        color: var(--white);

        & a {
          color: inherit;
          text-decoration: none;
        }

        & a:hover {
          text-decoration: underline;
          text-decoration-color: var(--yellow);
          text-decoration-thickness: 1px;
          text-underline-offset: 6px;
        }
      }

      /* ==================================================================
         5. Header
         ================================================================== */

      body > header {
        display: flex;
        align-items: center;
        gap: var(--space);
        padding: var(--space) var(--inset);

        & img {
          display: block;
          width: 100px;
          height: auto;
        }

        /* Unit name: separated from the logo by a divider on small screens */
        & > a + a {
          display: flex;
          align-self: stretch;
          align-items: center;
          padding-left: var(--space);
          border-left: 1px solid var(--rule);
        }
      }

      /* ==================================================================
         6. Footer
         ================================================================== */

      body > footer {
        & > div {
          display: flex;
          flex-direction: column;
          gap: var(--gutter);
          padding: var(--space-lg) var(--inset);
          line-height: 1;
        }

        & address {
          display: flex;
          flex-direction: column;
          gap: var(--space);
          font-size: var(--text-base);
          font-style: normal;
        }

        & address p {
          color: var(--sand);
        }

        & nav {
          padding-top: var(--gutter);
          border-top: 1px solid var(--rule);
        }

        & ul {
          display: flex;
          flex-direction: column;
          gap: var(--space);
          list-style: none;
        }

        & nav a {
          color: var(--yellow);
          font-size: var(--text-sm);
        }

        & :is(address p, nav a) {
          letter-spacing: 1.5px;
          text-transform: uppercase;
        }

        /* Copyright bar */
        & > p {
          padding: var(--space) var(--gutter);
          background: var(--shade);
          color: var(--sand);
          font-size: var(--text-sm);
          text-align: center;
        }
      }

      /* ==================================================================
         7. Breakpoints
         ================================================================== */

      @media (width >= 740px) {
        body > header {
          justify-content: space-between;

          & > a + a {
            padding-left: 0;
            border-left: 0;
          }
        }

        body > footer {
          & > div {
            flex-direction: row;
            align-items: center;
            gap: var(--space-lg);
          }

          & address a {
            font-size: var(--text-base);
          }

          & nav {
            flex: 1;
            margin-top: 12px;
          }

          & ul {
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: var(--space) var(--space-lg);
          }

          & nav a {
            font-size: var(--text-sm);
          }
        }
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- ================================================================
         Site header
         ================================================================ -->
    <header>
      <a href="https://www.brown.edu/">
        <img src="logo.png" alt="Brown University" width="182" height="90" />
      </a>
      <a href="/">Service Name Here</a>
    </header>

    <!-- ================================================================
         Page content
         ================================================================ -->
    <main id="main" tabindex="-1">
      <!-- Page content goes here -->
    </main>

    <!-- ================================================================
         Site footer
         ================================================================ -->
    <footer>
      <div>
        <address>
          <p>Brown University</p>
          <a href="https://maps.brown.edu/">Providence, RI 02912</a>
        </address>

        <nav aria-label="Footer">
          <ul>
            <li>
              <a href="https://publicsafety.brown.edu/">Campus Safety</a>
            </li>
            <li>
              <a href="https://digital-accessibility.brown.edu/">Accessibility</a>
            </li>
          </ul>
        </nav>
      </div>

      <p>&copy; Brown University</p>
    </footer>
  </body>
</html>
